<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="972" viewBox="0 0 2048 972" font-family="'Red Hat Text', sans-serif">
<rect width="2048" height="972" fill="#ffffff"/>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a9ea6"/></marker>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c08a4a"/></marker>
</defs>
<text x="1024" y="62" text-anchor="middle" font-family="'Red Hat Display', 'Red Hat Text', sans-serif" font-size="31" font-weight="700" fill="#2b2b2b">Dual-write is unsafe — use the transactional outbox</text>
<text x="1024" y="92" text-anchor="middle" font-size="20" font-style="italic" fill="#6b6b6b">one local transaction writes state and an outbox row; CDC relays it to Kafka</text>
<rect x="122" y="347" width="382" height="208" rx="12" fill="#e8eef7" stroke="#2e5aa8" stroke-width="2.5"/>
<text x="313" y="384" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a6b">order-service</text>
<g font-size="16" fill="#1f3a6b" text-anchor="middle"><text x="313" y="406">1 transaction:</text><text x="313" y="428">INSERT order</text><text x="313" y="450">INSERT outbox row</text></g>
<rect x="660" y="312" width="382" height="278" rx="12" fill="#eeeeee" stroke="#888888" stroke-width="2.5"/>
<text x="851" y="349" text-anchor="middle" font-size="22" font-weight="700" fill="#444444">PostgreSQL</text>
<g font-size="16" fill="#444444" text-anchor="middle"><text x="851" y="371">orders table</text><text x="851" y="393">outbox table</text><text x="851" y="415">WAL / logical</text><text x="851" y="437">decoding</text></g>
<rect x="1197" y="365" width="313" height="173" rx="12" fill="#f5ebd5" stroke="#c49a5e" stroke-width="2.5"/>
<text x="1353" y="401" text-anchor="middle" font-size="22" font-weight="700" fill="#5a3b0e">Debezium</text>
<g font-size="16" fill="#5a3b0e" text-anchor="middle"><text x="1353" y="423">CDC connector</text><text x="1353" y="445">tails the WAL</text><text x="1353" y="467">no dual write</text></g>
<rect x="1666" y="312" width="278" height="278" rx="12" fill="#f7eedf" stroke="#c08a4a" stroke-width="2.5"/>
<text x="1805" y="447" text-anchor="middle" font-size="22" font-weight="700" fill="#5a3b0e">Kafka</text>
<text x="1805" y="469" text-anchor="middle" font-size="16" fill="#5a3b0e">order.placed</text>
<line x1="504" y1="451" x2="658" y2="451" stroke="#9a9ea6" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="1042" y1="451" x2="1195" y2="451" stroke="#9a9ea6" stroke-width="2.5" marker-end="url(#g)"/>
<line x1="1510" y1="451" x2="1664" y2="451" stroke="#c08a4a" stroke-width="2.5" marker-end="url(#m)"/>
<text x="1024" y="709" text-anchor="middle" font-size="20" fill="#7a5a2a">exactly the committed facts become events — atomically, in order</text>
<text x="1024" y="940" text-anchor="middle" font-size="20" font-style="italic" fill="#6b5530">The DB commit is the single source of truth; Debezium reads it from the write-ahead log, so a committed change is not lost when the service crashes.</text>
</svg>
