include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml
  - path: ../../_infra/compose-kafka.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: cndp-inventory
    depends_on:
      lgtm:
        condition: service_healthy
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317
      - MICROMETER_OTLP_URL=http://lgtm:4318/v1/metrics
      - INITIAL_STOCK=100

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: cndp-order-service
    depends_on:
      lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory:
        condition: service_started
    ports:
      - "8080:8080"
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/appdb
      - QUARKUS_DATASOURCE_USERNAME=appuser
      - QUARKUS_DATASOURCE_PASSWORD=apppass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - QUARKUS_GRPC_CLIENTS_INVENTORY_HOST=inventory
      - QUARKUS_GRPC_CLIENTS_INVENTORY_PORT=9000
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317
      - MICROMETER_OTLP_URL=http://lgtm:4318/v1/metrics
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  notification-consumer:
    build:
      context: notification-consumer
    container_name: cndp-notification
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/appdb
      - QUARKUS_DATASOURCE_USERNAME=appuser
      - QUARKUS_DATASOURCE_PASSWORD=apppass
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - OTEL_SERVICE_NAME=notification-consumer
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317
