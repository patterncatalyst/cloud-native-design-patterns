quarkus.http.port=8082
quarkus.grpc.server.port=9000
quarkus.grpc.server.use-separate-server=true

initial.stock=${INITIAL_STOCK:100}

quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.application.name=${OTEL_SERVICE_NAME:inventory-service}

quarkus.micrometer.export.otlp.url=${MICROMETER_OTLP_URL:http://localhost:4318/v1/metrics}
quarkus.micrometer.export.otlp.resource-attributes.service.name=${OTEL_SERVICE_NAME:inventory-service}
quarkus.micrometer.export.otlp.step=5s
