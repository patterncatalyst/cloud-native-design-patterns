spring:
  application:
    name: order-service
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

server:
  port: 8080

inventory:
  addr: ${INVENTORY_ADDR:inventory:50051}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - trace_id=%X{trace_id:-} %msg%n"
