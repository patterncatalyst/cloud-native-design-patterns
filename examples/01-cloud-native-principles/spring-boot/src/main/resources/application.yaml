spring:
  application:
    name: order-service
  jpa:
    open-in-view: false
    hibernate:
      # db/init owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
  datasource:
    hikari:
      # Fail the readiness probe quickly when Postgres is gone (default is 30 s).
      connection-timeout: 3000

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          additional-path: "server:/healthz"
        readiness:
          include: readinessState,db
          additional-path: "server:/readyz"

service:
  version: ${SERVICE_VERSION:0.0.0}
