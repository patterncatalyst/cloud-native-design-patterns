include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  saga-orchestrator:
    build:
      context: saga-orchestrator
    container_name: cndp-saga
    depends_on:
      lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/appdb
      - QUARKUS_DATASOURCE_USERNAME=appuser
      - QUARKUS_DATASOURCE_PASSWORD=apppass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4317
      - OTEL_SERVICE_NAME=saga-orchestrator
    devices:
      - "/dev/null:/dev/null:rwm"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
