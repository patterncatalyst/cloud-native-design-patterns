spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appdb
    username: appuser
    password: apppass
    hikari:
      connection-timeout: 2000   # fail fast: a flush against a down database is re-queued, the readiness probe goes down
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      lettuce:
        shutdown-timeout: 100ms

server:
  port: 8080

cache-service:
  ttl-seconds: 60
  flush-period-ms: 1000
  refresh-period-ms: 5000
  refresh-before-seconds: 10

spring.jpa:
  # Hibernate only checks the entities against db/init; it never changes the schema.
  open-in-view: false
  hibernate.ddl-auto: validate

# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health:
  probes.enabled: true
  group:
    liveness:
      include: livenessState
      additional-path: "server:/healthz"
    readiness:
      include: readinessState,db
      additional-path: "server:/readyz"
