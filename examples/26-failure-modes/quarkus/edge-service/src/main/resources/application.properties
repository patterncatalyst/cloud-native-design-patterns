quarkus.application.name=edge-service
quarkus.http.port=8080

quarkus.rest-client.backend.url=${BACKEND_URL:http://backend:8081}
quarkus.rest-client.backend.connect-timeout=5000
quarkus.rest-client.backend.read-timeout=2000

# SmallRye Health on the paths the compose healthchecks and verify.sh use.
quarkus.smallrye-health.liveness-path=/healthz
quarkus.smallrye-health.readiness-path=/readyz
