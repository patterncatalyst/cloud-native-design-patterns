server.port=8080

# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/healthz
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.readiness.additional-path=server:/readyz

# Circuit breaker: 5 failed calls in a row open it, it stays open 10 s, then 2 successful trial calls close it.
resilience4j.circuitbreaker.instances.backend.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.backend.sliding-window-size=5
resilience4j.circuitbreaker.instances.backend.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.backend.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.backend.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.backend.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.backend.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.backend.record-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException

# Retry: 3 attempts, waits from 100 ms doubling to a 2 s cap, each randomised by up to 50%.
resilience4j.retry.instances.backend.max-attempts=3
resilience4j.retry.instances.backend.wait-duration=100ms
resilience4j.retry.instances.backend.enable-exponential-backoff=true
resilience4j.retry.instances.backend.exponential-backoff-multiplier=2
resilience4j.retry.instances.backend.exponential-max-wait-duration=2s
resilience4j.retry.instances.backend.enable-randomized-wait=true
resilience4j.retry.instances.backend.randomized-wait-factor=0.5
resilience4j.retry.instances.backend.retry-exceptions=org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException

# Bulkhead: 5 concurrent calls; the next one is refused at once instead of waiting.
resilience4j.bulkhead.instances.backend.max-concurrent-calls=5
resilience4j.bulkhead.instances.backend.max-wait-duration=0
