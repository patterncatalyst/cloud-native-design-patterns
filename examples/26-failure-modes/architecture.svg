<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="30" width="80" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="60.0" y="60.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Client</text>
<rect x="160" y="20" width="190" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="255.0" y="48.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">edge-service</text>
<text x="255.0" y="65.0" font-size="11.5" fill="#555555" text-anchor="middle">timeout · retry · breaker</text>
<text x="255.0" y="80.0" font-size="11.5" fill="#555555" text-anchor="middle">bulkhead · deadline</text>
<text x="255.0" y="95.0" font-size="11.5" fill="#555555" text-anchor="middle">:8080</text>
<rect x="410" y="30" width="100" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="460.0" y="63.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">backend</text>
<text x="460.0" y="80.0" font-size="11.5" fill="#555555" text-anchor="middle">:8081</text>
<path d="M100,55 L160,55" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M350,65 L410,65" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="410" y="130" font-size="10" fill="#555555" text-anchor="start">/mode controls:</text>
<text x="410" y="145" font-size="10" fill="#888888" text-anchor="start">healthy | slow | failing | flaky</text>
<text x="160" y="140" font-size="10" fill="#b8650a" text-anchor="start">breaker trips → fallback</text>
<text x="160" y="155" font-size="10" fill="#b8650a" text-anchor="start">deadline exhausted → reject</text>
</svg>