server.port=8080

# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/healthz
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.readiness.additional-path=server:/readyz

# Per-tenant bulkhead: each tenant gets its own pool of 5 concurrent orders; the sixth is refused at once.
resilience4j.bulkhead.configs.tenant.max-concurrent-calls=5
resilience4j.bulkhead.configs.tenant.max-wait-duration=0
