server:
  port: 8080

spring:
  application:
    name: ws-server
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    com.cndp.ws: INFO

# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health:
  probes.enabled: true
  group:
    liveness:
      include: livenessState,pod
      show-details: always
      additional-path: "server:/healthz"
    readiness:
      include: readinessState,redis
      additional-path: "server:/readyz"
