quarkus.application.name=order-service
quarkus.http.port=8080

# One SIGTERM drives the drain: Quarkus fires ShutdownDelayInitiatedEvent, keeps serving for the
# delay so endpoints update, then stops HTTP, waits for in-flight requests (timeout) and exits.
quarkus.shutdown.delay-enabled=true
quarkus.shutdown.delay=${DRAIN_DELAY_SECONDS:5}S
quarkus.shutdown.timeout=20s

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appdb
quarkus.datasource.username=appuser
quarkus.datasource.password=apppass
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.idle-removal-interval=2S

# db/init owns the schema; Hibernate only checks that the entities match it.
quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.smallrye-health.liveness-path=/healthz
quarkus.smallrye-health.readiness-path=/readyz
