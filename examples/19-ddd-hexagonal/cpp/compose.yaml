name: cndp-19

include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  order-service:
    build: order-service
    container_name: cndp-order-service
    depends_on:
      lgtm: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      - PG_CONNINFO=postgresql://appuser:apppass@postgres:5432/appdb
      - PG_POOL_SIZE=4
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
    devices:
      - "/dev/null:/dev/null:rwm"
