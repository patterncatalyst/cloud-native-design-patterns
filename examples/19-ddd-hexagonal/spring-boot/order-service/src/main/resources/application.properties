server.port=8080

# Postgres datasource — DATABASE_URL is converted at startup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/appdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Logging
logging.level.events=INFO

# db/init owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fail the readiness probe quickly when Postgres is gone (default 30 s).
spring.datasource.hikari.connection-timeout=3000
# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/healthz
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.additional-path=server:/readyz
