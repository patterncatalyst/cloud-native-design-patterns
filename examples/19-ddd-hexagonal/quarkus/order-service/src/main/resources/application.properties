quarkus.application.name=order-service
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appdb
quarkus.datasource.username=appuser
quarkus.datasource.password=apppass
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.idle-removal-interval=2S

quarkus.log.category."events".level=INFO

# db/init owns the schema; Hibernate only checks that the entities match it.
quarkus.hibernate-orm.schema-management.strategy=validate

# SmallRye Health on the paths the compose healthchecks and verify.sh use.
quarkus.smallrye-health.liveness-path=/healthz
quarkus.smallrye-health.readiness-path=/readyz

# CLI adapter (cli-place-order): no HTTP server, only the domain event line and the command output.
%cli.quarkus.http.host-enabled=false
%cli.quarkus.banner.enabled=false
%cli.quarkus.log.level=WARN
%cli.quarkus.log.console.format=%s%n
