include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: cndp-inventory
    depends_on:
      lgtm:
        condition: service_healthy
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - OTEL_SERVICE_NAME=inventory
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf

  order-api:
    build:
      context: .
      dockerfile: order-api/Dockerfile
    container_name: cndp-order-api
    depends_on:
      lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/appdb
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=apppass
      - OTEL_SERVICE_NAME=order-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cndp-gateway
    depends_on:
      lgtm:
        condition: service_healthy
      order-api:
        condition: service_healthy
      inventory:
        condition: service_started
    ports:
      - "8080:8080"
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - ORDER_API_URL=http://order-api:8081
      - INVENTORY_ADDR=inventory:50051
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
