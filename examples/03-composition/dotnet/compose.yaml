include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  inventory:
    build:
      context: .
      dockerfile: Dockerfile.inventory
    container_name: cndp-inventory

  order-api:
    build:
      context: .
      dockerfile: Dockerfile.order-api
    container_name: cndp-order-api
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=Host=postgres;Port=5432;Database=appdb;Username=appuser;Password=apppass
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: cndp-gateway
    ports:
      - "8080:8080"
    environment:
      - ORDER_API_URL=http://order-api:8081
      - INVENTORY_ADDR=inventory:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    depends_on:
      order-api:
        condition: service_healthy
      inventory:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
