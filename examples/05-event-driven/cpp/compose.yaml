name: cndp-05

include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml
  - path: ../../_infra/compose-kafka.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  order-service:
    build: order-service
    container_name: cndp-order-service
    depends_on:
      lgtm: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      - PG_CONNINFO=postgresql://appuser:apppass@postgres:5432/appdb
      - KAFKA_BOOTSTRAP=kafka:9094
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  shipping-consumer:
    build: shipping-consumer
    container_name: cndp-shipping
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lgtm: { condition: service_healthy }
    environment:
      - PG_CONNINFO=postgresql://appuser:apppass@postgres:5432/appdb
      - KAFKA_BOOTSTRAP=kafka:9094
      - OTEL_SERVICE_NAME=shipping-consumer
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318

  notification-consumer:
    build: notification-consumer
    container_name: cndp-notification
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
      lgtm: { condition: service_healthy }
    environment:
      - PG_CONNINFO=postgresql://appuser:apppass@postgres:5432/appdb
      - KAFKA_BOOTSTRAP=kafka:9094
      - OTEL_SERVICE_NAME=notification-consumer
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
