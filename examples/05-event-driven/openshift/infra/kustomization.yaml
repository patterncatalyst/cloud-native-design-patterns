# Shared infrastructure for Example 05 on OpenShift: Kafka (AMQ Streams), Postgres (sclorg) and
# the LGTM stack. Kafka and LGTM are the minikube manifests with patches; Postgres is its own
# manifest because the image differs. Render with the schema from ../../db/init and the minikube
# files, which sit outside this directory:
#   oc kustomize --load-restrictor LoadRestrictionsNone infra | oc --context crc-admin apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cndp-05
labels:
  - pairs:
      app.kubernetes.io/part-of: cndp-05
    includeSelectors: false
resources:
  - ../../k8s/infra/kafka.yaml
  - ../../k8s/infra/lgtm.yaml
  - postgres.yaml
  - route-grafana.yaml
secretGenerator:
  - name: cndp-postgres-app
    literals:
      - username=appuser
      - password=apppass
    options:
      disableNameSuffixHash: true
configMapGenerator:
  - name: postgres-init
    files:
      - ../../db/init/00-extensions.sql
      - ../../db/init/01-schema.sql
    options:
      disableNameSuffixHash: true
  - name: postgres-openshift
    files:
      - postgres/10-cndp-schema.sh
      - postgres/cndp.conf
    options:
      disableNameSuffixHash: true
patches:
  # The AMQ Streams 3.2 bundle ships Kafka 4.1 and 4.2 broker images; minikube runs 4.3.1.
  - target:
      kind: Kafka
      name: cndp
    patch: |-
      - op: replace
        path: /spec/kafka/version
        value: 4.2.0
      - op: add
        path: /spec/kafka/metadataVersion
        value: 4.2-IV1
  # A Route replaces the NodePort.
  - target:
      kind: Service
      name: lgtm-grafana
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
  - path: lgtm-restricted.yaml
