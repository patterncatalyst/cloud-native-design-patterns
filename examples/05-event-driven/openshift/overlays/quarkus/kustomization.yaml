# The quarkus overlay from ../k8s, with the OpenShift component and images from the internal
# registry. build-push-images.sh pushes localhost/cndp-05/quarkus-<svc>:v1 to that registry.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cndp-05
resources:
  - ../../../k8s/overlays/quarkus
components:
  - ../../components/openshift
images:
  - name: localhost/cndp-05/quarkus-order-service
    newName: image-registry.openshift-image-registry.svc:5000/cndp-05/quarkus-order-service
    newTag: v1
  - name: localhost/cndp-05/quarkus-shipping-consumer
    newName: image-registry.openshift-image-registry.svc:5000/cndp-05/quarkus-shipping-consumer
    newTag: v1
  - name: localhost/cndp-05/quarkus-notification-consumer
    newName: image-registry.openshift-image-registry.svc:5000/cndp-05/quarkus-notification-consumer
    newTag: v1
