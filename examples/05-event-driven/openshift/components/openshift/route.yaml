# order-service is published through an edge-terminated Route on the cluster's wildcard
# domain: https://order-service-cndp-05.apps-crc.testing. Plain HTTP requests are redirected.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
spec:
  to:
    kind: Service
    name: order-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
