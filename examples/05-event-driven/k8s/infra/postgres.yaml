# Postgres 18 with the Example 05 schema. Same demo credentials as compose.
apiVersion: v1
kind: Service
metadata:
  name: cndp-postgres-rw
spec:
  selector:
    app.kubernetes.io/name: cndp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cndp-postgres
spec:
  serviceName: cndp-postgres-rw
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cndp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cndp-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          args:
            - postgres
            - -c
            - log_statement=all
            - -c
            - shared_buffers=128MB
          env:
            - name: POSTGRES_DB
              value: appdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cndp-postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cndp-postgres-app
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: --encoding=UTF8 --locale=C
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "appuser", "-d", "appdb"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
