# order-service is published on node port 30080 (minikube maps it to 127.0.0.1:30080).
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
