apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cndp-05
resources:
  - ../../base
images:
  - name: order-service
    newName: localhost/cndp-05/quarkus-order-service
    newTag: v1
  - name: shipping-consumer
    newName: localhost/cndp-05/quarkus-shipping-consumer
    newTag: v1
  - name: notification-consumer
    newName: localhost/cndp-05/quarkus-notification-consumer
    newTag: v1
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_DATASOURCE_JDBC_URL
          value: "jdbc:postgresql://cndp-postgres-rw:5432/appdb"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_DATASOURCE_USERNAME
          value: "$(PG_USER)"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: QUARKUS_DATASOURCE_PASSWORD
          value: "$(PG_PASSWORD)"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KAFKA_BOOTSTRAP_SERVERS
          value: "cndp-kafka-bootstrap:9092"
