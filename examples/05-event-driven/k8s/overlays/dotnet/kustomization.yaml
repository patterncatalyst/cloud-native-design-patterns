apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cndp-05
resources:
  - ../../base
images:
  - name: order-service
    newName: localhost/cndp-05/dotnet-order-service
    newTag: v1
  - name: shipping-consumer
    newName: localhost/cndp-05/dotnet-shipping-consumer
    newTag: v1
  - name: notification-consumer
    newName: localhost/cndp-05/dotnet-notification-consumer
    newTag: v1
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_URL
          value: "Host=cndp-postgres-rw;Port=5432;Database=appdb;Username=$(PG_USER);Password=$(PG_PASSWORD)"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KAFKA_BOOTSTRAP
          value: "cndp-kafka-bootstrap:9092"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SERVICE_VERSION
          value: "1.0.0"
