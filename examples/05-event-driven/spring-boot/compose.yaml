include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml
  - path: ../../_infra/compose-kafka.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  order-service:
    build:
      context: order-service
    container_name: cndp-order-service
    depends_on:
      lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/appdb
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=apppass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_SERVICE_NAME=order-service
    devices:
      - "/dev/null:/dev/null:rwm"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  shipping-consumer:
    build:
      context: shipping-consumer
    container_name: cndp-shipping
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/appdb
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=apppass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_SERVICE_NAME=shipping-consumer
    devices:
      - "/dev/null:/dev/null:rwm"

  notification-consumer:
    build:
      context: notification-consumer
    container_name: cndp-notification
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/appdb
      - SPRING_DATASOURCE_USERNAME=appuser
      - SPRING_DATASOURCE_PASSWORD=apppass
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_SERVICE_NAME=notification-consumer
    devices:
      - "/dev/null:/dev/null:rwm"
