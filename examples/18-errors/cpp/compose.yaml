name: cndp-18

include:
  - path: ../../_infra/compose-lgtm.yaml

services:
  order-service:
    build: order-service
    container_name: cndp-order-service
    depends_on:
      lgtm: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    ports:
      - "8080:8080"
    environment:
      - INVENTORY_HOST=inventory-service:50051
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s

  inventory-service:
    build: inventory-service
    container_name: cndp-inventory
    depends_on:
      lgtm: { condition: service_healthy }
    ports:
      - "50051:50051"
    environment:
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
