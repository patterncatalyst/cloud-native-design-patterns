services:
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.8.1
    container_name: cndp-lgtm
    ports:
      - "3000:3000"
      - "4318:4318"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    devices:
      - "/dev/null:/dev/null:rwm"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: cndp-inventory
    devices:
      - "/dev/null:/dev/null:rwm"
    environment:
      - INITIAL_STOCK=5
      - FAIL_MODE=none

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: cndp-order-service
    devices:
      - "/dev/null:/dev/null:rwm"
    depends_on:
      lgtm:
        condition: service_healthy
      inventory:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - INVENTORY_ADDR=inventory:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
      - OTEL_SERVICE_NAME=order-service
      - GRPC_DEADLINE_MS=3000
