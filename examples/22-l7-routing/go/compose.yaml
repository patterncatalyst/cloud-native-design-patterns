name: cndp-22-go

services:
  envoy:
    image: docker.io/envoyproxy/envoy:v1.39.3
    container_name: cndp-envoy
    user: "101"
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml"]
    ports:
      - "8080:8080"
    volumes:
      - ../envoy/envoy.yaml:/etc/envoy/envoy.yaml:Z,ro
    depends_on:
      order-v1:
        condition: service_healthy
      order-v2:
        condition: service_healthy
    healthcheck:
      # The envoy image has no curl; bash's /dev/tcp does the HTTP check. HTTP/1.1,
      # because Envoy answers HTTP/1.0 with 426.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order-v1:
    build:
      context: order-service
      dockerfile: Containerfile
    container_name: cndp-order-v1
    environment:
      - APP_VERSION=v1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order-v2:
    build:
      context: order-service
      dockerfile: Containerfile
    container_name: cndp-order-v2
    environment:
      - APP_VERSION=v2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  router-service:
    build:
      context: router-service
      dockerfile: Containerfile
    container_name: cndp-router-service
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
