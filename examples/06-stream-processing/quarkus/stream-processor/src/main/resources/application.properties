quarkus.http.host-enabled=false

# Kafka Streams: application.id is also the consumer group (verify.sh looks for "stream-processor")
quarkus.kafka-streams.application-id=stream-processor
quarkus.kafka-streams.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Emit updated window aggregates every second instead of every 30 s (default)
kafka-streams.commit.interval.ms=1000
kafka-streams.cache.max.bytes.buffering=0
kafka-streams.auto.offset.reset=earliest
kafka-streams.state.dir=/tmp/kafka-streams

window.seconds=${WINDOW_SECONDS:10}

quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.application.name=${OTEL_SERVICE_NAME:stream-processor}
