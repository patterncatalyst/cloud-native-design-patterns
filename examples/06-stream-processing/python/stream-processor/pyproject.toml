[project]
name = "cndp-06-stream-processor"
version = "1.0.0"
description = "Cloud-native design patterns example: 06-stream-processing/python/stream-processor"
requires-python = ">=3.14"
dependencies = [
  "aiokafka==0.14.0",
  "faust-streaming==0.15.3",
  "opentelemetry-api==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
]

[tool.uv]
package = false
constraint-dependencies = ["aiohttp==3.14.4", "multidict==6.9.1"]
