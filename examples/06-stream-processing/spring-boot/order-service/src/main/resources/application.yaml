server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:apppass}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

spring.jpa:
  # Hibernate only checks the entities against db/init; it never changes the schema.
  open-in-view: false
  hibernate.ddl-auto: validate

# Fail the readiness probe quickly when Postgres is gone (default 30 s).
spring.datasource.hikari.connection-timeout: 3000
# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health:
  probes.enabled: true
  group:
    liveness:
      include: livenessState
      additional-path: "server:/healthz"
    readiness:
      include: readinessState,db
      additional-path: "server:/readyz"
