spring:
  application:
    name: stream-processor
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    streams:
      # application.id is also the consumer group (verify.sh looks for "stream-processor")
      application-id: stream-processor
      state-dir: /tmp/kafka-streams
      properties:
        # Emit updated window aggregates every second instead of every 30 s (default)
        commit.interval.ms: 1000
        statestore.cache.max.bytes: 0
        auto.offset.reset: earliest
        # A record that cannot be deserialized is logged and skipped, not fatal
        deserialization.exception.handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

window:
  seconds: ${WINDOW_SECONDS:10}
