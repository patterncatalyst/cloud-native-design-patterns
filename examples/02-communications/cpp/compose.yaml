name: cndp-02

include:
  - path: ../../_infra/compose-lgtm.yaml
  - path: ../../_infra/compose-postgres.yaml
  - path: ../../_infra/compose-kafka.yaml

services:
  postgres:
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d:Z

  inventory:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: cndp-inventory
    depends_on:
      lgtm:
        condition: service_healthy
    environment:
      - INITIAL_STOCK=100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: cndp-order-service
    depends_on:
      lgtm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - PG_CONNINFO=host=postgres port=5432 dbname=appdb user=appuser password=apppass
      - KAFKA_BOOTSTRAP=kafka:9094
      - INVENTORY_ADDR=inventory:50051
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://lgtm:4318
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
