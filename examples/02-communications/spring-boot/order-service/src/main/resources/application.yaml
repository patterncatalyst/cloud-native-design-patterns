spring:
  application:
    name: order-service
  graphql:
    graphiql:
      enabled: true
  kafka:
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8080

# Spring gRPC client channel (plaintext inside the compose network).
spring.grpc.client.channel.inventory.target: ${INVENTORY_ADDR:inventory:50051}

spring.jpa:
  # Hibernate only checks the entities against db/init; it never changes the schema.
  open-in-view: false
  hibernate.ddl-auto: validate

# Fail the readiness probe quickly when Postgres is gone (default 30 s).
spring.datasource.hikari.connection-timeout: 3000
# /healthz and /readyz on the main port are the liveness and readiness probe groups.
management.endpoint.health:
  probes.enabled: true
  group:
    liveness:
      include: livenessState
      additional-path: "server:/healthz"
    readiness:
      include: readinessState,db
      additional-path: "server:/readyz"
