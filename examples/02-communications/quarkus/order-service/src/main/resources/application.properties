# HTTP server
quarkus.http.port=8080

# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/orders}

# gRPC client configuration
quarkus.grpc.clients.inventory.host=${QUARKUS_GRPC_CLIENTS_INVENTORY_HOST:localhost}
quarkus.grpc.clients.inventory.port=${QUARKUS_GRPC_CLIENTS_INVENTORY_PORT:9000}

# Kafka configuration
mp.messaging.outgoing.order-placed.connector=smallrye-kafka
mp.messaging.outgoing.order-placed.topic=order.placed
mp.messaging.outgoing.order-placed.value.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# GraphQL configuration
quarkus.smallrye-graphql.ui.always-include=true

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# OpenTelemetry
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
quarkus.application.name=${OTEL_SERVICE_NAME:order-service}
