<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="10" y="10" width="400" height="440" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="22" y="30" font-size="12" font-weight="700" fill="#1d1d1d">Build stage (discarded)</text>
<rect x="430" y="10" width="440" height="440" rx="12" fill="#eef4fb" stroke="#ddd"/>
<text x="442" y="30" font-size="12" font-weight="700" fill="#1d1d1d">Runtime stage (shipped)</text>
<rect x="30" y="55" width="180" height="55" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="120.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ubi9/dotnet-100</text>
<text x="120.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">SDK image (~780 MB)</text>
<rect x="230" y="55" width="160" height="55" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="310.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">SDK tools</text>
<text x="310.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">MSBuild, NuGet, Roslyn</text>
<rect x="30" y="140" width="360" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">COPY *.csproj → dotnet restore</text>
<text x="210.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">download NuGet packages (cached layer)</text>
<rect x="30" y="210" width="360" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="233.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">COPY source → dotnet publish -c Release</text>
<text x="210.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">compile C# → CIL, tree-shake deps</text>
<rect x="30" y="290" width="170" height="55" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="115.0" y="308.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">/app output</text>
<text x="115.0" y="325.0" font-size="11.5" fill="#dddddd" text-anchor="middle">*.dll + deps</text>
<text x="115.0" y="340.0" font-size="11.5" fill="#dddddd" text-anchor="middle">~30–80 MB</text>
<rect x="220" y="290" width="170" height="55" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="305.0" y="308.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">PublishTrimmed</text>
<text x="305.0" y="325.0" font-size="11.5" fill="#555555" text-anchor="middle">removes unused BCL</text>
<text x="305.0" y="340.0" font-size="11.5" fill="#555555" text-anchor="middle">assemblies</text>
<rect x="450" y="55" width="200" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="550.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ubi9/dotnet-100-aspnet</text>
<text x="550.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">runtime image (~170 MB)</text>
<rect x="670" y="55" width="180" height="55" rx="9" fill="#f4f4f4" stroke="#888888" stroke-width="1.5"/>
<text x="760.0" y="80.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Runtime only</text>
<text x="760.0" y="97.5" font-size="11.5" fill="#555555" text-anchor="middle">CoreCLR + ASP.NET Core</text>
<rect x="450" y="140" width="400" height="50" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="650.0" y="163.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">COPY --from=build /app .</text>
<text x="650.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">only the published output, no SDK</text>
<rect x="450" y="210" width="200" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="550.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">EXPOSE 8080</text>
<text x="550.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">Kestrel binds 8080</text>
<rect x="670" y="210" width="180" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="760.0" y="235.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">non-root user</text>
<text x="760.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">UID 1001 (UBI default)</text>
<rect x="450" y="290" width="400" height="55" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="650.0" y="315.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Final image: ~200 MB</text>
<text x="650.0" y="332.5" font-size="11.5" fill="#dddddd" text-anchor="middle">UBI9 base + ASP.NET runtime + app DLLs</text>
<rect x="450" y="370" width="190" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="545.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Kubernetes Pod</text>
<text x="545.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">limits, probes, OTel</text>
<rect x="660" y="370" width="190" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="755.0" y="395.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Podman / Docker</text>
<text x="755.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">compose for local dev</text>
<path d="M210,82 L230,82" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M210,110 L210,140" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="216.0" y="119.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">step 1</text>
<text x="216.0" y="119.0" font-size="11" fill="#555" text-anchor="middle">step 1</text>
<path d="M210,190 L210,210" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="216.0" y="194.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">step 2</text>
<text x="216.0" y="194.0" font-size="11" fill="#555" text-anchor="middle">step 2</text>
<path d="M210,260 L115,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M200,317 L450,165" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="331.0" y="235.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">COPY --from=build</text>
<text x="331.0" y="235.0" font-size="11" fill="#b8650a" text-anchor="middle">COPY --from=build</text>
<path d="M650,82 L670,82" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M650,190 L650,210" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M650,265 L650,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M545,345 L545,370" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M755,345 L755,370" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="375" font-size="11" fill="#888888" text-anchor="start">Red Hat UBI images are freely redistributable</text>
<text x="30" y="395" font-size="11" fill="#888888" text-anchor="start">and supported for production use.</text>
<text x="30" y="425" font-size="11" fill="#888888" text-anchor="start">The SDK never ships — only the runtime and your app DLLs.</text>
</svg>