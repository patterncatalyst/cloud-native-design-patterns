<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="30" y="50" width="260" height="400" rx="12" fill="#fff0f0" stroke="#ddd"/>
<text x="42" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Tier 1 — AdminNetworkPolicy</text>
<rect x="320" y="50" width="260" height="400" rx="12" fill="#f0f5ff" stroke="#ddd"/>
<text x="332" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Tier 2 — NetworkPolicy</text>
<rect x="610" y="50" width="260" height="400" rx="12" fill="#f5f0ff" stroke="#ddd"/>
<text x="622" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Tier 3 — BANP</text>
<rect x="60" y="90" width="200" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ANP evaluates</text>
<text x="160.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">cluster-scoped, priority 0-99</text>
<rect x="60" y="170" width="200" height="45" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="160.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Allow</text>
<text x="160.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">traffic flows immediately</text>
<rect x="60" y="235" width="200" height="45" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="160.0" y="255.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Deny</text>
<text x="160.0" y="272.5" font-size="11.5" fill="#dddddd" text-anchor="middle">traffic blocked immediately</text>
<rect x="60" y="300" width="200" height="45" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Pass</text>
<text x="160.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">hand to tier 2</text>
<rect x="350" y="90" width="200" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="450.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">NP evaluates</text>
<text x="450.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">namespace-scoped, app-owned</text>
<rect x="350" y="170" width="200" height="45" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="450.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Match</text>
<text x="450.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">apply NP rules</text>
<rect x="350" y="235" width="200" height="45" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="450.0" y="255.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">No NP exists</text>
<text x="450.0" y="272.5" font-size="11.5" fill="#555555" text-anchor="middle">hand to tier 3</text>
<rect x="640" y="90" width="200" height="55" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="740.0" y="115.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">BANP evaluates</text>
<text x="740.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">cluster singleton, safety net</text>
<rect x="640" y="170" width="200" height="45" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="740.0" y="190.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Allow</text>
<text x="740.0" y="207.5" font-size="11.5" fill="#555555" text-anchor="middle">traffic flows</text>
<rect x="640" y="235" width="200" height="45" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="740.0" y="255.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Deny</text>
<text x="740.0" y="272.5" font-size="11.5" fill="#dddddd" text-anchor="middle">traffic blocked</text>
<path d="M260,322 L350,117" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="311.0" y="213.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">pass</text>
<text x="311.0" y="213.5" font-size="11" fill="#555" text-anchor="middle">pass</text>
<path d="M550,257 L640,117" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="601.0" y="181.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no match</text>
<text x="601.0" y="181.0" font-size="11" fill="#555" text-anchor="middle">no match</text>
<text x="450" y="30" font-size="14" fill="#1d1d1d" text-anchor="start" font-weight="700">OVN-Kubernetes three-tier policy evaluation</text>
<text x="60" y="370" font-size="11" fill="#666" text-anchor="start">Platform team controls tiers 1 and 3 (guardrails).</text>
<text x="350" y="370" font-size="11" fill="#666" text-anchor="start">App teams control tier 2 (their policies).</text>
<text x="640" y="370" font-size="11" fill="#666" text-anchor="start">BANP catches unmatched traffic.</text>
<text x="60" y="395" font-size="11" fill="#666" text-anchor="start">ANP Allow/Deny are final — NP and BANP are skipped.</text>
<text x="640" y="395" font-size="11" fill="#666" text-anchor="start">BANP is overridable by NetworkPolicy.</text>
</svg>